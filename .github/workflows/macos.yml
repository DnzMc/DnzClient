# Builds DNZ Launcher for macOS on GitHub's Mac machines: one .dmg for Apple Silicon (M1 and newer)
# and one for Intel Macs. Runs by hand (Actions -> "macOS DMG" -> Run workflow) and for every "v*" tag.
name: macOS DMG

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: apple-silicon
          - runner: macos-15-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # The Microsoft sign-in app id is a repository secret, never in the code.
      - name: Keys
        env:
          MS: ${{ secrets.MICROSOFT_CLIENT_ID }}
        run: printf 'microsoft.clientId=%s\n' "$MS" > src/main/resources/dnz-keys.properties

      # Mac icon (.icns) from the DNZ logo.
      - name: Icon
        run: |
          mkdir -p build/icon/dnz.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s src/main/resources/logo.png --out build/icon/dnz.iconset/icon_${s}x${s}.png > /dev/null
            d=$((s * 2))
            sips -z $d $d src/main/resources/logo.png --out build/icon/dnz.iconset/icon_${s}x${s}@2x.png > /dev/null
          done
          iconutil -c icns build/icon/dnz.iconset -o build/icon/dnz.icns

      - name: Build DMG
        run: |
          chmod +x gradlew
          ./gradlew packageDmg --no-daemon
          mkdir -p ../out
          for f in build/compose/binaries/main/dmg/*.dmg; do
            cp "$f" "../out/DNZ-Launcher-macOS-${{ matrix.arch }}.dmg"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: DNZ-Launcher-macOS-${{ matrix.arch }}
          path: out/*.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.dmg
